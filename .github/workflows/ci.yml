name: CI

# Two jobs.
#
# `ci` — typecheck + lint + unit tests. No build: the *deployed*
# build is owned by Vercel's GitHub integration, which runs on every
# push with the real env from Project Settings. Duplicating it here
# would double the work and the failure emails. Vercel stays the
# single source of truth for what ships.
#
# `e2e` — does build, because there is no other way to drive a real
# browser against real pages. It builds with public values plus a
# placeholder service key (see the job), so it never needs the live
# secret and never produces a deployable artifact. It is not the
# deploy; it is the only automated accessibility gate.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Vercel project's runtime. They drifted (20 vs
          # 24.x), which means CI was type-checking and testing against
          # a different Node than the one that actually serves the app.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  # The e2e suite is the only layer that renders real pages in a real
  # browser, and the only automated accessibility gate. It was not run
  # by CI at all, which is how it came to sit on a genuine WCAG AA
  # failure and a smoke test asserting that a 404 was a 200 — both
  # found the first time anyone ran it.
  #
  # Needs a built app, so unlike the checks above it does build here.
  # The three NEXT_PUBLIC_* values are public by definition (they ship
  # in the client bundle) so they live as repo *variables*, not
  # secrets. `SUPABASE_SERVICE_ROLE_KEY` is a real secret and is NOT
  # provided: `env.ts` only requires it to be non-empty, and no public
  # route calls `createServiceClient`, so a placeholder boots the app
  # for smoke + a11y without putting the live key in CI.
  #
  # The auth specs sign in as a dedicated test climber whose
  # credentials are repo secrets — encrypted, masked in logs, and
  # never sent to fork PRs. They are the only automated coverage of a
  # signed-in session.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-real-key
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      # Strict exactly when it can be. On a fork PR GitHub withholds
      # secrets, so this resolves empty and the auth specs skip loudly
      # instead of failing a contributor's build for something they
      # can't provide. Everywhere the credentials do exist, a skipped
      # suite is a failed build.
      CHORK_STRICT_TESTS: ${{ secrets.E2E_TEST_PASSWORD && '1' || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fail with something actionable rather than a confusing build
      # error deep in the Next output.
      # Plain `if`, not `[ -z … ] && …`: GitHub runs `run:` under
      # `bash -e`, where a false `&&` test exits non-zero — so the
      # short form would fail the step precisely when the variable IS
      # set correctly.
      - name: Check e2e config
        run: |
          missing=""
          for var in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_SITE_URL; do
            if [ -z "${!var}" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repo variables:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions -> Variables."
            echo "All three are public values - they already ship in the client bundle."
            exit 1
          fi
          echo "e2e config present."

      # Browsers come from Playwright's CDN and are cached per Playwright
      # version; OS libraries come from apt and are NOT allowed to hold
      # the build hostage. `--with-deps` ran `apt-get update` against
      # Azure's Ubuntu mirror on every run, and on 2026-08-19 that
      # mirror was down: three consecutive main runs sat on the step
      # until the 15-minute job timeout cancelled them, for a commit
      # whose identical PR run had passed in two minutes. So: the
      # browser install never touches apt, and the deps install is
      # bounded at two minutes and advisory — the ubuntu-latest image
      # already ships Chrome's shared libraries, so a missing lib would
      # fail the E2E step itself, loudly, rather than hang here.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Playwright OS deps (bounded, advisory)
        run: |
          # `timeout` (no --foreground) signals the whole process group, so
          # the sudo'd apt-get underneath dies with it instead of lingering
          # on the step's stdout; -k makes sure of it.
          if ! timeout -k 15 120 pnpm exec playwright install-deps chromium </dev/null; then
            echo "::warning::apt could not install Playwright's OS deps within 2 minutes (mirror down?); relying on the runner image's libraries."
          fi

      - run: pnpm build

      - name: E2E (smoke + a11y + auth)
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
